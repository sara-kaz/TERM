# ═══════════════════════════════════════════════════════════════════════════
# 3. Octo on CALVIN  (already in finetune_calvin_job.yaml — re-expose here)
# ═══════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: ConfigMap
metadata:
  name: octo-calvin-scripts-v2
  namespace: csun-ehuang-era
data:
  run.sh: |
    #!/bin/bash
    set -euo pipefail

    echo "=== Installing dependencies ==="
    apt-get update -qq && apt-get install -y -qq git wget unzip
    /opt/conda/bin/pip install --quiet "jax[cuda12]"
    /opt/conda/bin/python -c "import jax,sys; d=jax.devices(); g=[x for x in d if x.platform=='gpu']; print('[jax-verify] jax='+jax.__version__+' gpu='+str(len(g)),flush=True); sys.exit('ERROR: No GPU. devices='+str(d)) if not g else 0"
    /opt/conda/bin/pip install --quiet "tensorflow-datasets>=4.5.0,<4.9.0" "tensorflow-metadata<1.14.0" pillow
    /opt/conda/bin/pip install --quiet "tensorflow-probability>=0.22.0,<0.24.0"
    /opt/conda/bin/pip install --quiet distrax einops ml-collections absl-py huggingface_hub \
        "transformers>=4.35.0,<4.41.0" sentencepiece
    /opt/conda/bin/pip install --quiet "git+https://github.com/kvablack/dlimp.git"
    /opt/conda/bin/pip install --quiet "git+https://github.com/octo-models/octo.git" flax optax chex pyyaml google-cloud-storage

    echo "=== Cloning TERM repo ==="
    git clone https://github.com/sara-kaz/TERM.git /workspace/TERM

    DATA_PKL=/data/calvin_episodes.pkl
    echo "=== Downloading calvin_episodes.pkl from GCS (~10 GB) ==="
    wget -q --show-progress -O "${DATA_PKL}" \
        "https://storage.googleapis.com/sara-kaz-term/data/calvin_episodes.pkl"
    echo "pkl size: $(du -sh ${DATA_PKL} | cut -f1)"

    echo "=== Running Octo on CALVIN (seed 42, 14 bins, 30 epochs, patience 25) ==="
    cd /workspace/TERM
    python -m baselines.finetune_octo_calvin \
        --data_path   "${DATA_PKL}" \
        --output_dir  /results \
        --seed        42 \
        --epochs      30 \
        --batch_size  16 \
        --lr_backbone 1e-5 \
        --lr_head     1e-4 \
        --patience    25

    echo "=== Result ==="
    cat /results/results.json

---
apiVersion: batch/v1
kind: Job
metadata:
  name: octo-calvin-v2
  namespace: csun-ehuang-era
  labels:
    app: calvin-baselines
    model: octo
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 28800  # 8 hr hard cap (JAX warm-start + 30 epochs)
  template:
    metadata:
      labels:
        app: calvin-baselines
        model: octo
    spec:
      restartPolicy: Never
      containers:
      - name: train
        image: pytorch/pytorch:2.3.0-cuda12.1-cudnn8-runtime
        command: ["/bin/bash", "/scripts/run.sh"]
        env:
        - name: XLA_PYTHON_CLIENT_PREALLOCATE
          value: "false"
        - name: PYTHONUNBUFFERED
          value: "1"
        resources:
          requests:
            cpu: "4"
            memory: "32Gi"
            nvidia.com/gpu: "1"
          limits:
            cpu: "4"
            memory: "32Gi"
            nvidia.com/gpu: "1"
        volumeMounts:
        - name: scripts
          mountPath: /scripts
        - name: data-vol
          mountPath: /data
        - name: results-vol
          mountPath: /results
      volumes:
      - name: scripts
        configMap:
          name: octo-calvin-scripts-v2
          defaultMode: 0755
      - name: data-vol
        emptyDir:
          sizeLimit: "250Gi"
      - name: results-vol
        emptyDir:
          sizeLimit: "10Gi"
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule

---
# ═══════════════════════════════════════════════════════════════════════════
# 4. OpenVLA on CALVIN
# ═══════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: ConfigMap
metadata:
  name: openvla-calvin-scripts-v2
  namespace: csun-ehuang-era
data:
  run.sh: |
    #!/bin/bash
    set -euo pipefail

    echo "=== Installing dependencies ==="
    apt-get update -qq && apt-get install -y -qq git wget unzip
    pip install --quiet \
        "torch==2.3.0" "torchvision==0.18.0" \
        "transformers>=4.41.0,<4.45.0" \
        "accelerate>=0.29.0,<0.34.0" \
        bitsandbytes peft \
        "timm>=0.9.10,<1.0.0" \
        pillow numpy pyyaml google-cloud-storage

    echo "=== Cloning TERM repo ==="
    git clone https://github.com/sara-kaz/TERM.git /workspace/TERM

    DATA_PKL=/data/calvin_episodes.pkl
    echo "=== Downloading calvin_episodes.pkl from GCS (~10 GB) ==="
    wget -q --show-progress -O "${DATA_PKL}" \
        "https://storage.googleapis.com/sara-kaz-term/data/calvin_episodes.pkl"
    echo "pkl size: $(du -sh ${DATA_PKL} | cut -f1)"

    echo "=== Running OpenVLA on CALVIN (seed 42, 14 bins, LoRA) ==="
    cd /workspace/TERM
    python -m baselines.finetune_openvla_calvin \
        --data_path  "${DATA_PKL}" \
        --output_dir /results \
        --seed       42 \
        --epochs     5 \
        --batch_size 4 \
        --lr         2e-4 \
        --lora_r     16 \
        --lora_alpha 32

    echo "=== Result ==="
    cat /results/results.json

---
apiVersion: batch/v1
kind: Job
metadata:
  name: openvla-calvin-v2
  namespace: csun-ehuang-era
  labels:
    app: calvin-baselines
    model: openvla
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 28800  # 8 hr hard cap
  template:
    metadata:
      labels:
        app: calvin-baselines
        model: openvla
    spec:
      restartPolicy: Never
      containers:
      - name: train
        image: pytorch/pytorch:2.3.0-cuda12.1-cudnn8-runtime
        command: ["/bin/bash", "/scripts/run.sh"]
        env:
        - name: HF_HOME
          value: "/hf_cache"
        - name: TRANSFORMERS_CACHE
          value: "/hf_cache"
        - name: TOKENIZERS_PARALLELISM
          value: "false"
        - name: PYTHONUNBUFFERED
          value: "1"
        resources:
          requests:
            cpu: "4"
            memory: "32Gi"
            nvidia.com/gpu: "1"
          limits:
            cpu: "4"
            memory: "32Gi"
            nvidia.com/gpu: "1"
        volumeMounts:
        - name: scripts
          mountPath: /scripts
        - name: data-vol
          mountPath: /data
        - name: results-vol
          mountPath: /results
        - name: hf-cache
          mountPath: /hf_cache
      volumes:
      - name: scripts
        configMap:
          name: openvla-calvin-scripts-v2
          defaultMode: 0755
      - name: data-vol
        emptyDir:
          sizeLimit: "250Gi"
      - name: results-vol
        emptyDir:
          sizeLimit: "10Gi"
      - name: hf-cache
        emptyDir:
          sizeLimit: "50Gi"
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
