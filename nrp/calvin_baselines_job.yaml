# ─────────────────────────────────────────────────────────────────────────────
# NRP Kubernetes Jobs: CALVIN D→D baselines for Table 1 CALVIN column
# Namespace: csun-ehuang-era
#
# Runs 4 models in parallel (one pod each):
#   cnn-lstm-calvin   — frozen CLIP + LSTM,  14 bins
#   numvla-calvin     — TERM arch + numerical token, 14 bins
#   octo-calvin       — full backbone fine-tune, 14 bins (JAX image)
#   openvla-calvin    — LoRA fine-tune, 14 bins
#
# CNN-LSTM and NumericalVLA are fast (~1-2 hr); Octo/OpenVLA take ~3-6 hr.
#
# Deploy:
#   kubectl apply -f nrp/calvin_baselines_job.yaml -n csun-ehuang-era
#
# Monitor:
#   kubectl get pods -n csun-ehuang-era -l app=calvin-baselines
#
# Retrieve results:
#   kubectl logs -f <pod-name> -n csun-ehuang-era
# ─────────────────────────────────────────────────────────────────────────────

# ── Shared data-fetch helper script ─────────────────────────────────────────
# Each pod independently fetches CALVIN data (no shared volume).
# CNN-LSTM / NumericalVLA pods use the pytorch image (fast).
# Octo pod uses the existing octo-calvin-ft job (already in finetune_calvin_job.yaml).

# ═══════════════════════════════════════════════════════════════════════════
# 1. CNN-LSTM on CALVIN
# ═══════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: ConfigMap
metadata:
  name: cnn-lstm-calvin-scripts
  namespace: csun-ehuang-era
data:
  run.sh: |
    #!/bin/bash
    set -euo pipefail

    echo "=== System packages ==="
    apt-get update -qq && apt-get install -y -qq git wget unzip

    echo "=== Python deps ==="
    pip install --quiet torch torchvision numpy pillow "git+https://github.com/openai/CLIP.git" google-cloud-storage

    echo "=== Cloning TERM repo ==="
    git clone --quiet https://github.com/sara-kaz/TERM.git /workspace/TERM
    cd /workspace/TERM

    DATA_PKL=/data/calvin_episodes.pkl
    echo "=== Downloading calvin_episodes.pkl from GCS (~10 GB) ==="
    wget -q --show-progress -O "${DATA_PKL}" \
        "https://storage.googleapis.com/sara-kaz-term/data/calvin_episodes.pkl"
    echo "pkl size: $(du -sh ${DATA_PKL} | cut -f1)"

    echo "=== Running CNN-LSTM on CALVIN (seed 42, 14 bins) ==="
    python -m baselines.finetune_cnn_lstm_lt \
        --data_path  "${DATA_PKL}" \
        --output_dir /results \
        --seed       42 \
        --epochs     30 \
        --batch_size 32 \
        --num_actions 14 \
        --patience   15

    echo "=== Result ==="
    cat /results/results.json

---
apiVersion: batch/v1
kind: Job
metadata:
  name: cnn-lstm-calvin
  namespace: csun-ehuang-era
  labels:
    app: calvin-baselines
    model: cnn-lstm
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 14400  # 4 hr hard cap — prevents ContainerStatusUnknown hangs
  template:
    metadata:
      labels:
        app: calvin-baselines
        model: cnn-lstm
    spec:
      restartPolicy: Never
      containers:
      - name: train
        image: pytorch/pytorch:2.3.0-cuda12.1-cudnn8-runtime
        command: ["/bin/bash", "/scripts/run.sh"]
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        resources:
          requests:
            cpu: "4"
            memory: "16Gi"
            nvidia.com/gpu: "1"
          limits:
            cpu: "4"
            memory: "16Gi"
            nvidia.com/gpu: "1"
        volumeMounts:
        - name: scripts
          mountPath: /scripts
        - name: data-vol
          mountPath: /data
        - name: results-vol
          mountPath: /results
      volumes:
      - name: scripts
        configMap:
          name: cnn-lstm-calvin-scripts
          defaultMode: 0755
      - name: data-vol
        emptyDir:
          sizeLimit: "250Gi"
      - name: results-vol
        emptyDir:
          sizeLimit: "5Gi"
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule

---
# ═══════════════════════════════════════════════════════════════════════════
# 2. NumericalVLA on CALVIN
