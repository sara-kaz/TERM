    echo "=== Python deps ==="
    pip install --quiet torch torchvision numpy pillow "git+https://github.com/openai/CLIP.git" google-cloud-storage

    echo "=== Cloning TERM repo ==="
    git clone --quiet https://github.com/sara-kaz/TERM.git /workspace/TERM
    cd /workspace/TERM

    DATA_PKL=/data/calvin_episodes.pkl
    echo "=== Downloading calvin_episodes.pkl from GCS (~10 GB) ==="
    wget -q --show-progress -O "${DATA_PKL}" \
        "https://storage.googleapis.com/sara-kaz-term/data/calvin_episodes.pkl"
    echo "pkl size: $(du -sh ${DATA_PKL} | cut -f1)"

    echo "=== Running NumericalVLA on CALVIN (seed 42, 14 bins, action_dim=7) ==="
    python -m baselines.finetune_numvla_lt \
        --data_path   "${DATA_PKL}" \
        --output_dir  /results \
        --seed        42 \
        --epochs      80 \
        --batch_size  32 \
        --num_actions 14 \
        --action_dim  7 \
        --patience    25

    echo "=== Result ==="
    cat /results/results.json

